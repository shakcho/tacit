worker_processes 1;
events {}

http {
    upstream tacit_api {
        server api-one:8080;
        server api-two:8080;
    }

    server {
        listen 8080;

        location = /v1/events {
            proxy_pass http://tacit_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass_header X-Accel-Buffering;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 35s;
            proxy_next_upstream off;
            gzip off;
            add_header X-Tacit-Fixture-Replica $upstream_addr;
        }

        location = /v1/auth/session {
            proxy_pass http://tacit_api;
        }
    }
}
