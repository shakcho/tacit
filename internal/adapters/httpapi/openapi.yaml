openapi: 3.1.0
info:
  title: Tacit control-plane API
  version: 0.1.0
  description: >-
    The versioned HTTP contract for Tacit's product control plane. Large media
    objects and provider media streams use dedicated storage and media-plane
    protocols instead of this API.
servers:
  - url: /
tags:
  - name: System
  - name: Shell samples
paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [System]
      summary: Report process liveness
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
  /readyz:
    get:
      operationId: getReadiness
      tags: [System]
      summary: Report traffic readiness
      responses:
        "200":
          description: The process can accept application traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/shell-samples:
    post:
      operationId: createShellSample
      tags: [Shell samples]
      summary: Exercise the typed command boundary
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A caller-generated key that identifies one command attempt.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9._~-]+$"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShellSampleInput"
      responses:
        "201":
          description: The sample was created.
          headers:
            Location:
              description: Canonical URL for the sample.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShellSampleResult"
        "200":
          description: The original result was replayed for the idempotency key.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShellSampleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/shell-samples/{sampleId}:
    get:
      operationId: getShellSample
      tags: [Shell samples]
      summary: Exercise the typed query boundary
      parameters:
        - name: sampleId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShellSampleID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The sample exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellSample"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: An optional caller correlation ID. Invalid values are replaced.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RequestID:
      description: The accepted or generated request correlation ID.
      schema:
        type: string
  schemas:
    Probe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ShellSampleID:
      type: string
      pattern: "^smp_[0-9a-f]{32}$"
      example: smp_0123456789abcdef0123456789abcdef
    MediaTime:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      description: A nonnegative recording-relative offset in microseconds.
      example: "1234567"
    ShellSample:
      type: object
      additionalProperties: false
      required: [id, offsetMicroseconds]
      properties:
        id:
          $ref: "#/components/schemas/ShellSampleID"
        offsetMicroseconds:
          $ref: "#/components/schemas/MediaTime"
    CreateShellSampleInput:
      type: object
      additionalProperties: false
      required: [id, offsetMicroseconds]
      properties:
        id:
          $ref: "#/components/schemas/ShellSampleID"
        offsetMicroseconds:
          $ref: "#/components/schemas/MediaTime"
    CreateShellSampleResult:
      type: object
      additionalProperties: false
      required: [sample, replayed]
      properties:
        sample:
          $ref: "#/components/schemas/ShellSample"
        replayed:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        requestId:
          type: string
  responses:
    BadRequest:
      description: The JSON request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The command conflicts with an existing sample or idempotency record.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTooLarge:
      description: The request body exceeds the boundary limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not JSON.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: A typed input or required header is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The operation cannot be completed by this process.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
