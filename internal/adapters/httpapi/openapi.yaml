openapi: 3.1.0
info:
  title: Tacit control-plane API
  version: 0.1.0
  description: >-
    The versioned HTTP contract for Tacit's product control plane. Large media
    objects and provider media streams use dedicated storage and media-plane
    protocols instead of this API.
servers:
  - url: /
tags:
  - name: System
  - name: Identity
  - name: Realtime
  - name: Shell samples
paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [System]
      summary: Report process liveness
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
  /readyz:
    get:
      operationId: getReadiness
      tags: [System]
      summary: Report traffic readiness
      responses:
        "200":
          description: The process can accept application traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/session:
    get:
      operationId: getAuthenticationSession
      tags: [Identity]
      summary: Resolve the managed identity to the current local principal
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The active membership, policy decisions, and replay cursor share a database snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/events:
    get:
      operationId: streamEvents
      tags: [Realtime]
      summary: Stream invalidations for the authenticated member session
      description: |
        Fetch the canonical authentication session before opening the stream. Supply its cursor or the
        last fully processed SSE id in Last-Event-ID. The verified token determines the workspace and user.
        The response begins with an SSE comment and sends heartbeat comments every ten seconds when idle.
        An invalidate event requests a canonical session refetch. A checkpoint advances the cursor.
        Resync and access_revoked are terminal events without a cursor. On resync, discard scoped cache
        data and obtain a new snapshot. On access_revoked, discard scoped data and end the subscription.
      security:
        - bearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: Opaque cursor from the last snapshot or fully processed SSE event.
          required: true
          schema:
            $ref: "#/components/schemas/RealtimeCursor"
      x-sse-events:
        invalidate:
          $ref: "#/components/schemas/RealtimeInvalidation"
        checkpoint:
          $ref: "#/components/schemas/RealtimeCheckpoint"
        resync:
          $ref: "#/components/schemas/RealtimeResync"
        access_revoked:
          $ref: "#/components/schemas/RealtimeAccessRevoked"
      responses:
        "200":
          description: Incremental Server-Sent Events.
          headers:
            Cache-Control:
              schema:
                type: string
                const: "no-store, no-transform"
            X-Accel-Buffering:
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: A query, body, or explicit workspace scope was supplied.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: RESYNC_REQUIRED. The resume cursor is missing, unusable, or too far behind.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/auth/session-denials:
    post:
      operationId: denyAuthenticationSession
      tags: [Identity]
      summary: Deny the verified provider session before browser sign-out
      description: Internal server-to-server operation. It is not exposed by the browser API proxy.
      x-internal: true
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The provider session is durably denied locally.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /webhooks/workos:
    post:
      operationId: receiveWorkOSWebhook
      tags: [Identity]
      summary: Receive one signed WorkOS lifecycle event
      parameters:
        - name: WorkOS-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: The verified event was durably applied, replayed, or recorded as ignored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/shell-samples:
    post:
      operationId: createShellSample
      tags: [Shell samples]
      summary: Exercise the typed command boundary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TacitOrganization"
        - name: Idempotency-Key
          in: header
          required: true
          description: A caller-generated key that identifies one command attempt.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9._~-]+$"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShellSampleInput"
      responses:
        "201":
          description: The sample was created.
          headers:
            Location:
              description: Canonical URL for the sample.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShellSampleResult"
        "200":
          description: The original result was replayed for the idempotency key.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShellSampleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/shell-samples/{sampleId}:
    get:
      operationId: getShellSample
      tags: [Shell samples]
      summary: Exercise the typed query boundary
      security:
        - bearerAuth: []
      parameters:
        - name: sampleId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShellSampleID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TacitOrganization"
      responses:
        "200":
          description: The sample exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellSample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: WorkOS access JWT
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: An optional caller correlation ID. Invalid values are replaced.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TacitOrganization:
      name: X-Tacit-Organization
      in: header
      required: true
      description: The local organization selected for this tenant request.
      schema:
        $ref: "#/components/schemas/OrganizationID"
  headers:
    RequestID:
      description: The accepted or generated request correlation ID.
      schema:
        type: string
  schemas:
    Probe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    OrganizationID:
      type: string
      pattern: "^org_[0-9a-f]{32}$"
      example: org_0123456789abcdef0123456789abcdef
    UserID:
      type: string
      pattern: "^usr_[0-9a-f]{32}$"
      example: usr_0123456789abcdef0123456789abcdef
    MembershipRole:
      type: string
      enum: [admin, editor, viewer]
    AuthorizationAction:
      type: string
      enum:
        - read
        - create
        - update
        - delete
        - manage_members
        - manage_collaborators
        - publish
        - manage_shares
        - issue_media_grant
        - subscribe
        - search
        - enqueue_work
        - submit_worker_result
    AuthorizationResource:
      type: string
      enum: [organization, project, meeting, recording, transcript, highlight, playlist, share, administration]
    AuthorizationScope:
      type: string
      enum: [context, resource]
    AuthorizationDecision:
      type: object
      additionalProperties: false
      required: [action, resource, scope, subject, allowed]
      properties:
        action:
          $ref: "#/components/schemas/AuthorizationAction"
        resource:
          $ref: "#/components/schemas/AuthorizationResource"
        scope:
          $ref: "#/components/schemas/AuthorizationScope"
        subject:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^(context|resource)/"
        allowed:
          type: boolean
    AuthorizationSnapshot:
      type: object
      additionalProperties: false
      required: [policyRevision, decisions]
      properties:
        policyRevision:
          type: string
          minLength: 1
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/AuthorizationDecision"
    AuthenticationSession:
      type: object
      additionalProperties: false
      required: [userId, organizationId, roles, authorization, cursor, revision]
      properties:
        userId:
          $ref: "#/components/schemas/UserID"
        organizationId:
          $ref: "#/components/schemas/OrganizationID"
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MembershipRole"
        authorization:
          $ref: "#/components/schemas/AuthorizationSnapshot"
        cursor:
          $ref: "#/components/schemas/RealtimeCursor"
        revision:
          $ref: "#/components/schemas/SessionRevision"
    RealtimeCursor:
      type: string
      pattern: "^v1\\.[A-Za-z0-9_-]{75}$"
      description: Opaque, signed identifier bound to the authenticated user, workspace, and policy revision.
    SessionRevision:
      type: string
      pattern: "^(0|[1-9][0-9]{0,18})$"
      description: Nonnegative decimal revision through which the workspace session snapshot is current.
    RealtimeInvalidation:
      type: object
      additionalProperties: false
      required: [resource, revision]
      properties:
        resource:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              enum: [authentication_session]
            id:
              $ref: "#/components/schemas/UserID"
        revision:
          $ref: "#/components/schemas/SessionRevision"
    RealtimeCheckpoint:
      type: object
      additionalProperties: false
      maxProperties: 0
    RealtimeResync:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [RESYNC_REQUIRED]
    RealtimeAccessRevoked:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [ACCESS_REVOKED]
    ShellSampleID:
      type: string
      pattern: "^smp_[0-9a-f]{32}$"
      example: smp_0123456789abcdef0123456789abcdef
    MediaTime:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      description: A nonnegative recording-relative offset in microseconds.
      example: "1234567"
    ShellSample:
      type: object
      additionalProperties: false
      required: [id, offsetMicroseconds]
      properties:
        id:
          $ref: "#/components/schemas/ShellSampleID"
        offsetMicroseconds:
          $ref: "#/components/schemas/MediaTime"
    CreateShellSampleInput:
      type: object
      additionalProperties: false
      required: [id, offsetMicroseconds]
      properties:
        id:
          $ref: "#/components/schemas/ShellSampleID"
        offsetMicroseconds:
          $ref: "#/components/schemas/MediaTime"
    CreateShellSampleResult:
      type: object
      additionalProperties: false
      required: [sample, replayed]
      properties:
        sample:
          $ref: "#/components/schemas/ShellSample"
        replayed:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        requestId:
          type: string
  responses:
    BadRequest:
      description: The JSON request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The managed identity credential is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The identity is valid but has no active local membership.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The command conflicts with an existing sample or idempotency record.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTooLarge:
      description: The request body exceeds the boundary limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not JSON.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: A typed input or required header is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The operation cannot be completed by this process.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
