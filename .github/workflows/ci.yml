name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-database-budget.mjs
      - run: node --test scripts/*.test.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -cover ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: tacit_test_source
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tacit_test_source"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      TACIT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tacit_test_source?sslmode=disable
      TACIT_RESTORE_SOURCE_URL: postgres://postgres:postgres@127.0.0.1:5432/tacit_test_source?sslmode=disable
      TACIT_RESTORE_TARGET_URL: postgres://postgres:postgres@127.0.0.1:5432/tacit_test_restore?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: createdb --host 127.0.0.1 --username postgres tacit_test_restore
      - run: ./scripts/test-postgres.sh
      - run: ./scripts/verify-postgres-restore.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tacit/web check:toolchain
      - run: pnpm --recursive generate
      - run: pnpm --recursive lint
      - run: pnpm --recursive typecheck
      - run: pnpm --recursive test
      - name: Production build with environment canary
        run: pnpm --recursive build
        env:
          NEXT_PUBLIC_API_BASE_PATH: /api
          TACIT_PRIVATE_BUNDLE_CANARY: tacit-private-${{ github.sha }}
      - run: pnpm --filter @tacit/web check:environment
        env:
          TACIT_PRIVATE_BUNDLE_CANARY: tacit-private-${{ github.sha }}
      - run: pnpm --filter @tacit/web exec playwright install --with-deps chromium
      - run: pnpm --filter @tacit/web test:e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.18
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.19
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: PYTHONPATH=services/speech/src uv run --locked --all-packages python -m unittest discover -s services/speech/tests

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-generated.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/charts/tacit
