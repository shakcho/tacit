name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
      - run: node scripts/check-boundaries.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -cover ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
      - run: corepack enable
      - run: corepack prepare pnpm@12.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --recursive lint
      - run: pnpm --recursive typecheck
      - run: pnpm --recursive test
      - run: pnpm --recursive build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.18
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.19
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: PYTHONPATH=services/speech/src uv run --locked --all-packages python -m unittest discover -s services/speech/tests

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
      - run: corepack enable
      - run: corepack prepare pnpm@12.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-generated.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/charts/tacit
